# Storefront production stack — C2.28.
#
# Backend stack'i (`Elchi-Marketplace/docker-compose.prod.yml`) yaratadigan
# `marketplace_edge` tarmog'iga ulanadi. Domen bo'lganda Cloudflare Tunnel
# yoki Caddy shu tarmoq orqali `storefront:3001` ga proxy qiladi va port
# tashqariga umuman ochilmaydi.
#
# Productionda tashqi port ochilmaydi: Caddy ildiz domenni shu servisning
# `storefront:3001` tarmoq manziliga uzatadi.

services:
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build vaqtida faqat rasm hosti uchun kerak (images.remotePatterns).
        API_BASE_URL: ${API_BASE_URL}
        MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://api.elchimarket.uz/media}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL kerak — masalan https://elchimarket.uz}
    image: marketplace-storefront:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Ishlash vaqtidagi qiymatlar. Bularni o'zgartirish uchun qayta build
      # SHART EMAS — konteynerni qayta ko'tarish yetadi.
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL kerak}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL kerak}
    networks:
      edge:
        aliases:
          - storefront

networks:
  # Backend stack'i yaratadi. Bu yerda faqat ulanamiz.
  edge:
    name: marketplace_edge
    external: true
