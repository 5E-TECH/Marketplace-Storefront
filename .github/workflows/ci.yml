name: CI
on:
  push:
    # Ilgari filtr YO'Q edi — har bir shoxchaga push'da to'liq CI (jumladan
    # docker build) ishga tushardi. Deploy baribir faqat `main`da bo'ladi.
    branches: [main, dev]
  pull_request:
permissions:
  contents: read

# Ketma-ket ikki merge bo'lsa, ikkala deploy bitta katalogga rsync qilib
# to'qnashardi. Kabinet va backend repolarida bu blok allaqachon bor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

      # Docker image haqiqatan quriladimi — deploy paytida bilish kech bo'ladi.
      - name: Docker image quriladimi
        run: docker build --build-arg API_BASE_URL=http://api.example.com/api/v1 --build-arg NEXT_PUBLIC_SITE_URL=https://shop.example.com -t marketplace-storefront:ci .

  # C2.28 TC2. Secretlar qo'yilmaguncha bu job o'tkazib yuboriladi —
  # aks holda har push'da qizil bo'lib turardi.
  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      # ILGARI bu yerda JIM o'tkazib yuboradigan guard turardi: secret bo'lmasa
      # `ready=false` qo'yilib, keyingi barcha qadamlar `if:` bilan tashlab
      # ketilardi. Natijada run "success" ko'rinardi, lekin HECH NARSA
      # chiqmasdi — storefront shu sababli 2026-09-15 dan 09-21 gacha eski
      # kodda turgan va buni hech kim sezmagan. Endi yetishmayotgan secret
      # AYNAN nomi bilan aytiladi va job QIZIL bo'ladi.
      - name: Deploy secretlari tekshiruvi
        run: |
          missing=''
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            eval "value=\${$key:-}"
            [ -n "$value" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy secretlari yo'q:$missing"
            echo "Qo'shing: Settings → Secrets and variables → Actions" >&2
            echo "  DEPLOY_HOST = server IP" >&2
            echo "  DEPLOY_USER = deploy" >&2
            echo "  DEPLOY_SSH_KEY = maxfiy kalitning base64 nusxasi (bir qatorli)" >&2
            echo "  DEPLOY_KNOWN_HOSTS = ssh-keyscan -H <IP> chiqishi" >&2
            exit 1
          fi

      - name: SSH konfiguratsiyasini tayyorlash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Kalit base64'dan to'g'ri ochilganini darhol tekshiramiz: secret'ga
          # qator uzilishi tushsa yoki xom matn qo'yilsa, xato shu yerda
          # tushunarli chiqadi, rsync ichida emas.
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || {
            echo "::error::DEPLOY_SSH_KEY buzuq — base64 emas yoki nusxalashda qator uzilishi tushgan"
            exit 1
          }

      # Eng ko'p uchraydigan nosozlik: kalit serverdagi authorized_keys da yo'q.
      - name: SSH ulanishini tekshirish
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" 'echo "SSH ulanishi OK: $(whoami)@$(hostname)"' || {
            echo "::error::Serverga SSH ulanib bo'lmadi. Ehtimoliy sabablar:"
            echo "  1) ochiq kalit /home/deploy/.ssh/authorized_keys ga qo'shilmagan" >&2
            echo "  2) DEPLOY_USER noto'g'ri (kutilgani: deploy)" >&2
            echo "  3) DEPLOY_KNOWN_HOSTS server kalitiga mos emas" >&2
            exit 1
          }

      # `docker image prune -f` deploy oxirida eski (endi tegsiz) image'ni
      # o'chiradi — teg qo'yilmasa orqaga qaytish yo'li yo'qoladi.
      # DIQQAT: masofaviy buyruq HEREDOC bilan yuboriladi, bir qatorli
      # `'...'` bilan EMAS. Birinchi urinishda aynan shunday yozilgan edi va
      # ichidagi o'zbekcha apostrof (`yo'q`) qatorni erta yopib, buyruqni
      # buzgan. `continue-on-error: true` tufayli qadam jimgina "success"
      # ko'rsatdi, teg esa qo'yilmadi — kabinet repoda 2026-09-21 deployda
      # oldingi image shu sabab yo'qoldi. Bu faylda matnga apostrof yozmang.
      - name: Hozirgi image'ni orqaga qaytish uchun teglash
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -eu
          if docker image inspect marketplace-storefront:latest >/dev/null 2>&1; then
            docker tag marketplace-storefront:latest marketplace-storefront:rollback-previous
            echo "Orqaga qaytish tegi qoyildi: marketplace-storefront:rollback-previous"
            docker image inspect marketplace-storefront:rollback-previous \
              --format 'Tasdiq: {{.Id}} {{.Created}}'
          else
            echo "Oldingi image topilmadi - birinchi deploy"
          fi
          REMOTE

      - name: Fayllarni serverga yuborish
        run: |
          # DIQQAT: bu yerga izoh YOZMANG. `\` bilan davom etadigan buyruq
          # ichidagi `#` qolgan argumentlarni (jumladan manba va nishonni)
          # kesib tashlaydi va rsync `exit 1` beradi — 2026-09-21 da aynan
          # shu sabab deploy yiqildi. Izohlar buyruqdan OLDIN turadi.
          #
          # `.env.production*` (yulduzcha bilan): bu repoda
          # `.env.production.example` YO'Q, serverda esa BOR — `--delete`
          # uni o'chirib yuborardi. Kabinet repoda bu fayl bor, shuning
          # uchun u yerda aniq ro'yxat ishlatiladi.
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env.production*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.next-dev/' \
            --exclude 'test-results/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/marketplace-storefront/"

      - name: Konteynerni yangilash
        run: |
          # Keepalive shart: Next.js build uzoq davom etadi va shu paytda
          # SSH ulanishi jim turadi (backend deploy'ida aynan shu sabab
          # uzilishlar bo'lgan).
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/marketplace-storefront
          test -f .env.production

          # Backend stack'i `marketplace_edge` tarmog'ini yaratadi.
          docker network inspect marketplace_edge >/dev/null 2>&1 || {
            echo "XATO: marketplace_edge tarmog'i yo'q — avval backend stack'ini ko'taring"
            exit 1
          }

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          # Konteyner haqiqatan javob berayotganini tasdiqlaymiz.
          healthy=false
          for attempt in $(seq 1 24); do
            if docker compose --env-file .env.production -f docker-compose.prod.yml \
                 exec -T storefront node -e "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              healthy=true
              break
            fi
            echo "Kutilmoqda... ($attempt/24)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "XATO: storefront konteyneri javob bermadi"
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail 50 storefront
            exit 1
          fi

          docker image prune -f
          REMOTE

      # Konteyner ichidagi healthcheck faqat konteyner tirikligini bildiradi.
      # Sayt HAQIQATAN tashqaridan ochilayotganini tunnel orqali tekshiramiz.
      - name: Tashqaridan tekshirish
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://elchimarket.uz/ || true)
            if [ "$code" = "200" ]; then
              echo "Storefront tashqaridan sog'lom ($code)"
              exit 0
            fi
            echo "Kutilmoqda... ($attempt/10, oxirgi javob: $code)"
            sleep 6
          done
          echo "::error::Storefront tashqaridan javob bermadi. Konteyner ko'tarilgan, lekin tunnel yo'lida muammo bor."
          exit 1
